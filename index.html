<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaotic Neutral Myco Tracker</title>

    <!-- %BASE_URL% keeps these valid for Vite web, desktop, and packaged builds. -->
    <link rel="icon" href="%BASE_URL%pwa-192.png" sizes="192x192" />
    <link rel="icon" href="%BASE_URL%pwa-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Apply saved appearance before React mounts to reduce theme flashing. -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem("preferences") || "{}");
          var mode = prefs.mode || localStorage.getItem("theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          var accent =
            prefs.accent ||
            localStorage.getItem("cn_last_accent") ||
            "emerald";

          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.classList.add(
            accent.indexOf("theme-") === 0 ? accent : "theme-" + accent
          );

          var style =
            prefs.themeStyle ||
            localStorage.getItem("cn_theme_style") ||
            "default";

          if (style === "chaotic") {
            document.documentElement.classList.add("bg-chaotic");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-zinc-900 text-black dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
