# .github/workflows/tauri-release.yml
name: Tauri Desktop Release

on:
  workflow_dispatch:

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI for release action
        shell: pwsh
        run: |
          npm install -g @tauri-apps/cli@2.11.4
          tauri --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Build desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "Chaotic Neutral Myco Tracker ${{ steps.version.outputs.tag }}"
          releaseBody: |
            Desktop release for Chaotic Neutral Myco Tracker.

            Includes the Windows NSIS installer and updater artifacts.
          releaseDraft: true
          includeUpdaterJson: true
          prerelease: false
          tauriScript: "tauri"
