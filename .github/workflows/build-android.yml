# .github/workflows/build-android.yml
name: Build Android APK/AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      CI: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest"

      - name: Prepare Android platform
        run: |
          if [ ! -f capacitor.config.json ] && [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts exists but capacitor.config.json is missing."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          if [ ! -f android/gradlew ]; then
            echo "android/gradlew was not found after Capacitor sync."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Check Android signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are present."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are not present. Release APK/AAB builds will be skipped."
          fi

      - name: Decode Android release keystore
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/my-release-key.jks
          ls -la android/app/my-release-key.jks

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble signed release APK and AAB
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
          ./gradlew :app:bundleRelease --stacktrace

      - name: Collect Android outputs
        id: collect
        shell: bash
        run: |
          mkdir -p release-android

          dbg_apk=$(ls -1 android/app/build/outputs/apk/debug/*-debug*.apk 2>/dev/null | head -n1 || true)
          rel_apk=$(ls -1 android/app/build/outputs/apk/release/*-release*.apk 2>/dev/null | head -n1 || true)
          aab=$(ls -1 android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n1 || true)

          if [ -n "$dbg_apk" ]; then
            cp "$dbg_apk" "release-android/Chaotic-Neutral-Myco-Tracker-${GITHUB_REF_NAME}-debug.apk"
          fi

          if [ -n "$rel_apk" ]; then
            cp "$rel_apk" "release-android/Chaotic-Neutral-Myco-Tracker-${GITHUB_REF_NAME}-release.apk"
          fi

          if [ -n "$aab" ]; then
            cp "$aab" "release-android/Chaotic-Neutral-Myco-Tracker-${GITHUB_REF_NAME}-release.aab"
          fi

          echo "Collected Android outputs:"
          find release-android -type f -maxdepth 1 -print

          debug_asset=$(ls -1 release-android/*-debug.apk 2>/dev/null | head -n1 || true)
          release_apk_asset=$(ls -1 release-android/*-release.apk 2>/dev/null | head -n1 || true)
          release_aab_asset=$(ls -1 release-android/*-release.aab 2>/dev/null | head -n1 || true)

          echo "debug_asset=$debug_asset" >> "$GITHUB_OUTPUT"
          echo "release_apk_asset=$release_apk_asset" >> "$GITHUB_OUTPUT"
          echo "release_aab_asset=$release_aab_asset" >> "$GITHUB_OUTPUT"

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts-${{ github.ref_name }}
          path: release-android/*
          if-no-files-found: error

      - name: Attach Android artifacts to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

          assets=(release-android/*)

          if [ ${#assets[@]} -eq 0 ] || [ ! -e "${assets[0]}" ]; then
            echo "No Android assets found to attach."
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" release-android/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber