# .github/workflows/build-android.yml
name: Build Android APK/AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      CI: "true"
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest"

      - name: Prepare Android platform
        run: |
          if [ ! -f capacitor.config.json ] && [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts exists but capacitor.config.json is missing."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          if [ ! -f android/gradlew ]; then
            echo "android/gradlew was not found after Capacitor sync."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Assemble Android outputs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          ./gradlew :app:assembleRelease --stacktrace
          ./gradlew :app:bundleRelease --stacktrace

      - name: Collect outputs
        id: collect
        shell: bash
        run: |
          mkdir -p release-artifacts/android
          rel_apk=$(ls -1 android/app/build/outputs/apk/release/*-release*.apk 2>/dev/null | head -n1 || true)
          dbg_apk=$(ls -1 android/app/build/outputs/apk/debug/*-debug*.apk 2>/dev/null | head -n1 || true)
          aab=$(ls -1 android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n1 || true)

          if [ -n "$rel_apk" ]; then
            cp "$rel_apk" "release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}-release.apk"
          fi

          if [ -n "$dbg_apk" ]; then
            cp "$dbg_apk" "release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}-debug.apk"
          fi

          if [ -n "$aab" ]; then
            cp "$aab" "release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}.aab"
          fi

          echo "rel_apk=$rel_apk" >> "$GITHUB_OUTPUT"
          echo "dbg_apk=$dbg_apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

          find release-artifacts/android -type f -maxdepth 1 -print

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          mkdir -p android-keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android-keystore/release.keystore

      - name: Sign copied release APK
        if: ${{ steps.collect.outputs.rel_apk != '' && env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          unsigned_apk="release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}-release.apk"
          signed_apk="release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}-release-signed.apk"

          apksigner sign --ks android-keystore/release.keystore \
            --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"

          apksigner verify --print-certs "$signed_apk"

      - name: Sign copied release AAB
        if: ${{ steps.collect.outputs.aab != '' && env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          aab_path="release-artifacts/android/chaotic-neutral-myco-${GITHUB_REF_NAME}.aab"

          jarsigner -keystore android-keystore/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            "$aab_path" \
            "$ANDROID_KEYSTORE_ALIAS"

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts-${{ github.ref_name }}
          path: release-artifacts/android/*
          if-no-files-found: ignore

      - name: Attach Android artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if compgen -G "release-artifacts/android/*" > /dev/null; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/android/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No Android artifacts found to attach to release."
          fi
