// android/app/build.gradle
apply plugin: 'com.android.application'

// Keep release signing credentials outside the repository.
def signingOverride = System.getenv('MYCO_ANDROID_SIGNING_PROPERTIES')
def signingPropertiesFile = signingOverride?.trim()
    ? new File(signingOverride)
    : new File(System.getProperty('user.home'), '.myco-tracker/android-signing.properties')
def signingProperties = new Properties()
def signingProblem = null
def releaseKeyFile = null
def repoDirectory = rootProject.projectDir.parentFile.canonicalFile.toPath()

if (!signingPropertiesFile.isAbsolute()) {
    signingProblem = 'MYCO_ANDROID_SIGNING_PROPERTIES must be an absolute path.'
} else if (signingPropertiesFile.canonicalFile.toPath().startsWith(repoDirectory)) {
    signingProblem = 'Signing properties must be stored outside the repository.'
} else if (!signingPropertiesFile.isFile()) {
    signingProblem = 'External Android signing properties file is missing.'
} else {
    try {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
        def requiredFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        if (requiredFields.any { !signingProperties.getProperty(it)?.trim() }) {
            signingProblem = 'External Android signing properties are incomplete.'
        } else {
            def configuredKey = new File(signingProperties.getProperty('storeFile'))
            releaseKeyFile = configuredKey.isAbsolute()
                ? configuredKey
                : new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile'))
            if (!releaseKeyFile.isFile()) {
                signingProblem = 'Configured Android signing keystore is missing.'
            }
        }
    } catch (Exception ignored) {
        signingProblem = 'External Android signing properties could not be loaded.'
    }
}
def releaseSigningReady = signingProblem == null

android {
    namespace = "com.chaoticneutral.myco"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.chaoticneutral.myco"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = releaseKeyFile
                storePassword = signingProperties.getProperty('storePassword')
                keyAlias = signingProperties.getProperty('keyAlias')
                keyPassword = signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
        }
    }
}


// Release packaging must fail if the external signing configuration is absent.
def verifyMycoReleaseSigning = tasks.register('verifyMycoReleaseSigning') {
    group = 'verification'
    description = 'Require external signing credentials before release packaging.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException("MYCO_RELEASE_SIGNING_REQUIRED: ${signingProblem}")
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease',
                      'assembleRelease', 'bundleRelease', 'packageRelease',
                      'packageReleaseBundle', 'signReleaseBundle']) {
        task.dependsOn(verifyMycoReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
